[package]
name = "holofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Marker cargo-fuzz keys on to recognise the crate as fuzz targets.
[package.metadata]
cargo-fuzz = true

# The fuzz targets each get their own [[bin]] entry so cargo-fuzz
# can invoke them individually via `cargo +nightly fuzz run <name>`.
[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false

[[bin]]
name = "whitelist_decode"
path = "fuzz_targets/whitelist_decode.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
holofs-wire = { path = "../crates/holofs-wire" }
holofs-model = { path = "../crates/holofs-model" }
holofs-storage = { path = "../crates/holofs-storage" }
