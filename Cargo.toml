[workspace]
resolver = "2"
members = [
  "crates/holofs-core",
  "crates/holofs-model",
  "crates/holofs-wire",
  "crates/holofs-codec",
  "crates/holofs-storage",
  "crates/holofs-client",
  "crates/holofs-cluster",
  "crates/holofs-analytics",
  "crates/holofs-gateway",
  "crates/holofs-cli",
  "crates/holofs-web",
  "crates/holofs-mcp",
  "crates/holofs-embed",
  "crates/holofs-e2e",
  "crates/holofs-testutils",
]
# Fuzz harnesses live outside the workspace so `cargo build/test`
# don't pick up `libfuzzer-sys` (which needs nightly + LLVM's fuzzer
# runtime) on a normal build. See `fuzz/README.md`.
exclude = [ "fuzz" ]

[workspace.package]
version = "1.0.0"
edition = "2021"
# Several transitive deps (tokio 1.41+, tracing-subscriber 0.3.19+,
# hyper 1.5+) have moved to 1.80/1.81 baselines. 1.81 is the common
# upper bound across the tree.
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/holofs/holofs"
# The workspace ships as a single binary distribution — none of the
# holofs-* crates are intended for crates.io. Individual crates opt
# back in by setting `publish = true` once their public API stabilises.
publish = false

[workspace.dependencies]
# Math/IO base
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "sync",
  "time",
  "signal",
] }
# CancellationToken for graceful shutdown across background tasks.
tokio-util = { version = "0.7", default-features = false, features = [ "rt" ] }
png = "0.18"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "png",
] }
symphonia = { version = "0.5", default-features = false, features = [
  "wav",
  "mp3",
  "flac",
  "vorbis",
  "ogg",
  "aac",
  "isomp4",
  "aiff",
  "pcm",
] }

# Crypto
ed25519-dalek = { version = "2", features = [ "rand_core" ] }
rand_core = { version = "0.6", features = [ "getrandom" ] }
# At-rest shard encryption: AES-256-GCM, HKDF-SHA256 for derivation
# from NodeIdentity's seed. Default-features off keeps the sha2 pull
# minimal (no asm).
aes-gcm = { version = "0.10", default-features = false, features = [
  "aes",
  "alloc",
] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# rustls TLS on the wire protocol. tokio-rustls 0.26 lines up with the
# rustls 0.23 line; rcgen self-signs the embedded-mode CA. rustls-pki-types
# ships the PEM parser under `rustls::pki_types::pem`.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
rcgen = { version = "0.13", default-features = false, features = [
  "ring",
  "pem",
] }

# Web stack: axum HTTP server + Leptos SSR. cargo-leptos drives the WASM build.
axum = { version = "0.7", default-features = false, features = [
  "http1",
  "tokio",
  "json",
  "matched-path",
  "tracing",
  "multipart",
] }
tower = { version = "0.4", default-features = false }
tower-http = { version = "0.5", default-features = false, features = [
  "fs",
  "compression-gzip",
  "trace",
  "set-header",
] }
http = "1"
http-body-util = "0.1"
mime_guess = "2"
# Streamed Server-Sent Events. axum::response::sse takes any Stream — the
# macro just keeps the SSE handler readable.
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"

# Embedded transactional KV. Backs the incremental catalog store
# (Phase 1 chunk 3): every catalog mutation lands in a single-entry
# write-txn with Immediate durability, so the previous whole-file
# `catalog.holo` rewrite per flush is replaced with a per-entry
# copy-on-write B-tree update. Pure-Rust, MIT/Apache, zero-config.
redb = "2"

# Operational concerns — CLI parser, structured logging.
clap = { version = "4", features = [ "derive", "env" ] }
# TOML config file support. `toml` needs serde derive.
toml = { version = "0.8", default-features = false, features = [ "parse" ] }
serde = { version = "1", features = [ "derive" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
  "ansi",
  "tracing-log",
] }

# Server-side markdown renderer for the in-app /help section. `gfm`
# enables tables/strikethrough/tasklists; `math` enables `$…$` and
# `$$…$$` capture (we render the actual math client-side via KaTeX).
pulldown-cmark = { version = "0.12", default-features = false, features = [
  "html",
] }

# Leptos 0.7 stable — clean `server_fn 0.7+` build chain, no
# unmaintained `proc-macro-error`/`paste` transitive deps.
leptos = { version = "0.7", default-features = false }
leptos_axum = { version = "0.7" }
leptos_router = { version = "0.7", default-features = false }
leptos_meta = { version = "0.7", default-features = false }

# WASM-side helpers (only pulled in by the `hydrate` feature of holofs-web).
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"

# Extras used by holofs-soak (long-running HTTP driver).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
] }
anyhow = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
# Used by holofs-soak-report to parse the raw /metrics text saved into
# metrics.jsonl (only labels + gauge/counter samples are consumed).
prometheus-parse = "0.2"

# Internal crates (path-deps)
holofs-core = { path = "crates/holofs-core", version = "1.0.0" }
holofs-model = { path = "crates/holofs-model", version = "1.0.0" }
holofs-wire = { path = "crates/holofs-wire", version = "1.0.0" }
holofs-codec = { path = "crates/holofs-codec", version = "1.0.0" }
holofs-storage = { path = "crates/holofs-storage", version = "1.0.0" }
holofs-client = { path = "crates/holofs-client", version = "1.0.0" }
holofs-cluster = { path = "crates/holofs-cluster", version = "1.0.0" }
holofs-analytics = { path = "crates/holofs-analytics", version = "1.0.0" }
holofs-gateway = { path = "crates/holofs-gateway", version = "1.0.0" }
holofs-mcp = { path = "crates/holofs-mcp", version = "1.0.0" }
holofs-embed = { path = "crates/holofs-embed", version = "1.0.0" }
holofs-testutils = { path = "crates/holofs-testutils", version = "1.0.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# === Workspace-wide lints (Rust 1.74+) ===================================
# Every crate opts in via `[lints] workspace = true`.
# Split into rust + clippy. pedantic with a list of reasonable allows; otherwise noisy.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic rules that are too noisy — turn them off:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
