[package]
name = "holofs-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP (Model Context Protocol) server exposing holofs as tools over Streamable HTTP."

[dependencies]
holofs-gateway.workspace = true
holofs-model.workspace = true
holofs-core.workspace = true
holofs-cluster.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
# base64 for blob payloads exposed via MCP `resources/`.
# Already a transitive dep through axum / multiparser; depending on it
# directly costs nothing and avoids a hand-rolled encoder.
base64 = "0.22"

# rmcp: official Rust MCP SDK from the modelcontextprotocol org. We pull
# in the server-side macros (`#[tool_router]` / `#[tool]`) plus the
# Streamable HTTP transport — the single-endpoint replacement for the
# legacy two-endpoint SSE transport. `schemars` derives JSON schemas for
# tool input types directly from `serde::Deserialize`.
rmcp = { version = "1.8", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = "1"

[lints]
workspace = true
