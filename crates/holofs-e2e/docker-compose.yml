# crates/holofs-e2e/docker-compose.yml
#
# Bring up a Selenium-standalone-chrome container that the e2e suite
# can target. Useful for CI runners that don't have Chrome installed,
# and as a clean local alternative to the per-host chromedriver
# binary.
#
# Usage:
#   docker compose -f crates/holofs-e2e/docker-compose.yml up -d
#   HOLOFS_E2E_WEBDRIVER=http://localhost:4444 \
#     crates/holofs-e2e/scripts/run-tests.sh
#   docker compose -f crates/holofs-e2e/docker-compose.yml down
#
# Notes:
# * Image is multi-arch (amd64 + arm64); pulls ~1 GB the first time.
# * Bridge mode + `host.docker.internal` lets the containerised
#   browser reach the host-side gateway. On Linux pass
#   `--add-host=host.docker.internal:host-gateway` (already in
#   `extra_hosts` below).
# * Memory: Chrome wants ≥ 2 GB; bumping shm-size prevents the
#   "DevToolsActivePort file doesn't exist" failure under load.

services:
  chrome:
    image: selenium/standalone-chrome:131.0
    shm_size: "2gb"
    ports:
      - "4444:4444"   # Selenium / WebDriver endpoint
      - "7900:7900"   # noVNC for live-watching tests (password = secret)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_VNC_NO_PASSWORD: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/wd/hub/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
