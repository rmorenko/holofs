[package]
name = "holofs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Holofs node storage: persistent shard store, Ed25519 identity, signed admin whitelist."

[dependencies]
holofs-core.workspace = true
holofs-wire.workspace = true
tokio.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
# at-rest shard encryption.
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
# wire-protocol TLS scaffold (server side of node↔gateway link).
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }

[dev-dependencies]
# tls.rs round-trip tests write certs to a TempDir and read them back.
tempfile = "3"

[features]
# Test-only fault injection for chaos scenarios (P1.6). Disabled by
# default so the release build never compiles the atomic fault
# registers or their check hooks — the two `maybe_fail_wal_*` helpers
# in `src/chaos.rs` collapse to inline `None` under `#[cfg]` when this
# feature is off, so WAL hot paths pay zero cost.
chaos = []

[lints]
workspace = true
