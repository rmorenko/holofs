name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # === Format check =========================================================
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # === Non-Rust style linters ===============================================
  # Prose (typos + markdownlint), TOML (taplo), and shell (shellcheck).
  # Rust code is covered by rustfmt + clippy in the jobs above/below.
  # Local equivalent: `make lint`.
  style:
    name: style (typos, markdownlint, taplo, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install typos
        uses: crate-ci/typos@master
        with:
          config: ./_typos.toml
      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
            | gunzip > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo
          taplo --version
      - name: taplo fmt --check
        run: taplo fmt --check
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.23.0
      - name: markdownlint-cli2
        run: markdownlint-cli2
      - name: shellcheck
        run: |
          shellcheck \
            deploy/dev-seed.sh \
            scripts/spawn-cluster.sh \
            tools/test-data/run-tests.sh \
            tools/test-data/fetch-real-landscapes.sh \
            tools/test-data/clean-cluster.sh \
            tools/test-data/upload-samples.sh \
            crates/holofs-e2e/scripts/run-tests.sh
      - name: doc-anchor check (github-slugger)
        run: |
          npm install --no-save github-slugger
          node scripts/check-doc-anchors.mjs
      - name: locale heading parity (EN ↔ ru/de/fr/es)
        run: python3 scripts/check-locale-parity.py
      - name: security-critical content parity (EN body hash gate)
        run: python3 scripts/check-security-parity.py
      - name: env-defaults parity (tuning.md ↔ manifest ↔ code)
        run: python3 scripts/check-env-defaults.py

  # === Clippy lints =========================================================
  # `holofs-web` has mutually-exclusive `ssr` and `hydrate` features, so we
  # cannot use `--all-features`. Lint the workspace with the default
  # feature set, then lint `holofs-web` once per feature flag.
  clippy:
    name: clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: clippy — workspace default features
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy — holofs-web (ssr)
        run: cargo clippy -p holofs-web --no-default-features --features ssr --all-targets -- -D warnings
      - name: clippy — holofs-web (hydrate, wasm32)
        run: cargo clippy -p holofs-web --no-default-features --features hydrate --target wasm32-unknown-unknown -- -D warnings

  # === Tests on multiple OS =================================================
  test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      # === P1.6 chaos scenarios ============================================
      # The `chaos` feature on `holofs-storage` unlocks fault-injection
      # hooks in the WAL write path (disk-full at append, disk-full at
      # fsync). The feature is off by default so the release build pays
      # zero cost; this step exercises the paths in a dedicated pass.
      - run: cargo test -p holofs-storage --features chaos --release

  # === Production WASM bundle ==============================================
  leptos:
    name: cargo-leptos build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (for wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
      - name: Install cargo-leptos
        run: cargo install --locked cargo-leptos
      - name: Build SSR binary + WASM bundle
        run: cargo leptos build --project holofs-web --release
      - name: Verify bundle exists
        run: |
          test -f target/site/pkg/holofs.wasm
          test -f target/site/pkg/holofs.js
          ls -la target/site/pkg/

  # === MSRV (workspace.rust-version) =======================================
  msrv:
    name: MSRV (1.81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  # === Documentation build ==================================================
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # === Security advisory + license audit ====================================
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # === Vulnerability audit (independent of deny) ============================
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # === Code coverage (optional, non-blocking) ===============================
  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
