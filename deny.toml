# cargo-deny config — security advisory + license + duplicate + source check.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Advisories we knowingly ship with. Each must come with a comment explaining
# the call-site and the planned upgrade path. Audit the list on every
# `cargo update`.
ignore = [
    # `paste` and `proc-macro-error2` are still pulled in by `leptos 0.7.x`
    # (via `either_of` and `leptos_macro` respectively). Upstream tracking:
    # https://github.com/leptos-rs/leptos/issues for the eventual drop.
    # Leptos 0.7 upgrade already shed `proc-macro-error 1.x` and
    # `rustls-pemfile`, so only these two remain.
    "RUSTSEC-2024-0436", # paste — unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained
]

[licenses]
# Permitted licenses for every transitive dep. Order matters only for
# readability — cargo-deny treats this as a set. Keep the list trim; if a
# new dep needs a license outside this list, prefer dropping the dep over
# expanding the policy.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    # Boost Software License — permissive, used by xxhash-rust (server_fn dep).
    "BSL-1.0",
]
confidence-threshold = 0.93
exceptions = []

# `ring` historically expressed its mixed license through a non-SPDX string;
# the LICENSE file in the crate is a concatenation of MIT + ISC + OpenSSL.
# This clarification tells cargo-deny exactly how to parse it.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate versions are tolerated as warnings — the Leptos 0.7 ecosystem
# still pulls in two `http`/`hashbrown` majors via `reactive_graph` and
# `tachys` transitives. Revisit once those crates publish hyper-1-only
# releases.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
